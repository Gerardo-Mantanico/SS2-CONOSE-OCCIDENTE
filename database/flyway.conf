# =============================================================================
# Configuración de Flyway
# -----------------------------------------------------------------------------
# Las credenciales (FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD) NO se colocan acá.
# Flyway las lee automáticamente desde variables de entorno con ese nombre.
# Van definidas en .env y se cargan al correr flyway:
#   export $(grep -v '^#' .env | xargs)
#   flyway migrate
# O usando el wrapper: bash run.sh
# =============================================================================

# Carpetas de migraciones - una por módulo
flyway.locations=filesystem:database/migrations

# Schemas que Flyway conoce y puede crear/modificar
flyway.schemas=meta
# Tabla de historial de migraciones (vive en el schema meta)
flyway.table=flyway_schema_history
flyway.defaultSchema=meta

# Comportamiento
# No permite correr migraciones si hay archivos locales que no están en el historial
# outOfOrder=false protege contra migraciones fantasma
flyway.outOfOrder=false
flyway.validateOnMigrate=true
flyway.encoding=UTF-8
flyway.mixed=false
flyway.ignoreMigrationPatterns=*:pending
